name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    # The Go pipeline + web UI are self-contained: the integration test
    # mocks the DESi service, so no Python / desi-governance is needed.
    name: Go (pipeline + web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: go vet
        working-directory: web
        run: go vet ./...
      - name: go test
        run: make test-go

  python:
    # The Python pipeline/CLI tests need the real desi-governance library,
    # which is NOT on PyPI - it lives in the hstre/DESi repository. We
    # check it out and install it editable.
    #
    # Cross-repo checkout of a PRIVATE repo needs a token with read access
    # to hstre/DESi, stored as the repository secret DESI_REPO_TOKEN. If
    # hstre/DESi is public, the default GITHUB_TOKEN already suffices.
    name: Python (pipeline + CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check out desi-governance (hstre/DESi)
        uses: actions/checkout@v4
        with:
          repository: hstre/DESi
          path: _desi
          token: ${{ secrets.DESI_REPO_TOKEN || github.token }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ./_desi
          pip install -e ".[test]"
      - name: pytest
        run: make test-py
