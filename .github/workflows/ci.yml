name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    # The Go pipeline + web UI are self-contained: the integration test
    # mocks the DESi service, so no Python / desi-governance is needed.
    name: Go (pipeline + web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: go vet
        working-directory: web
        run: go vet ./...
      - name: go test
        run: make test-go

  python:
    # The Python pipeline/CLI tests need the real desi-governance library,
    # which is NOT on PyPI - it lives in the (public) hstre/DESi repo. We
    # check it out and install it editable. hstre/DESi is public, so the
    # default GITHUB_TOKEN can read it; no extra secret is required.
    name: Python (pipeline + CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check out desi-governance (hstre/DESi)
        uses: actions/checkout@v4
        with:
          repository: hstre/DESi
          path: _desi
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ./_desi
          pip install -e ".[test]"
      - name: pytest
        run: make test-py
