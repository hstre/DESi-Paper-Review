# DESi Paper Review - example configuration (keyless, offline defaults).
#
# This file is SAFE to commit: it contains NO API key and defaults to a
# fully offline, deterministic run with no network access.
#
# To enable live LLM assistance (not implemented in the MVP pipeline, which
# is offline-only) you would have to:
#   1. copy this file to  config/paper_review.local.ini  (gitignored),
#   2. set BOTH  offline_mode = false  AND  allow_live_llm_calls = true,
#   3. export the API key into the environment variable named below.
#
# The API key itself is NEVER read from, written to, logged, or stored in
# any configuration file or output artifact. Only the NAME of the
# environment variable that holds it is ever recorded.

[paper_review]
# Offline by default: the pipeline performs no network access.
offline_mode = true
# Independent second gate. Live LLM calls require BOTH flags flipped.
allow_live_llm_calls = false

[llm]
# Only the NAME of the environment variable holding the key, never the key.
api_key_env = DESI_PAPER_REVIEW_API_KEY
provider = none
model = none
